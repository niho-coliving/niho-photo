[package]
name = "niho-camera-linear-probe"
description = "Experimental camera-linear working copy and deferred color probe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version = "1.89"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
wasm = ["dep:wasm-bindgen"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
niho-base-raw = { path = "../niho-base-raw" }
niho-develop = { path = "../niho-develop" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
wasm-bindgen = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rawler enables uuid/v4; use its browser RNG as in niho-base-raw-wasm.
uuid = { version = "1", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The local codec experiment is a CLI command; keep zlib out of the wasm library.
flate2 = "1"

[dev-dependencies]
niho-camera-color = { path = "../niho-camera-color" }
