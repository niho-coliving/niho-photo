[package]
name = "niho_desktop_account"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[dependencies]
base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
url = "2"
zeroize = "1"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
