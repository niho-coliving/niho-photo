{
  "name": "Public CI",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "public-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "plan": {
      "name": "Change scope",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "outputs": {
        "matrix": "${{ steps.scope.outputs.matrix }}",
        "has-native": "${{ steps.scope.outputs.has-native }}",
        "has-swift": "${{ steps.scope.outputs.has-swift }}",
        "photo-editing": "${{ steps.scope.outputs.photo-editing }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.15.0"
          }
        },
        {
          "id": "scope",
          "run": "node scripts/ci/scopes.mjs"
        }
      ]
    },
    "publication": {
      "name": "Publication guard",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.15.0"
          }
        },
        {
          "run": "node --test scripts/ci/*.test.mjs"
        },
        {
          "id": "contract-source",
          "run": "node -e 'const value = JSON.parse(require(\"node:fs\").readFileSync(\"docs/security/cloud-contract-source.json\", \"utf8\")); if (!/^[a-f0-9]{40}$/.test(value.commit)) process.exit(1); process.stdout.write(\"commit=\" + value.commit + String.fromCharCode(10));' >> \"$GITHUB_OUTPUT\""
        },
        {
          "env": {
            "CONTRACT_SOURCE_SHA": "${{ steps.contract-source.outputs.commit }}"
          },
          "run": "set -euo pipefail\nsource_dir=\"$RUNNER_TEMP/niho-docs-contract\"\nif ! [[ \"$CONTRACT_SOURCE_SHA\" =~ ^[a-f0-9]{40}$ ]]; then exit 1; fi\ngit init --quiet \"$source_dir\"\ngit -C \"$source_dir\" -c credential.helper= fetch --quiet --no-tags --depth=1 https://github.com/niho-coliving/niho-docs.git \"$CONTRACT_SOURCE_SHA\"\ngit -C \"$source_dir\" checkout --quiet --detach FETCH_HEAD\nnode scripts/ci/cloud-contract-sync.mjs \"$source_dir\""
        },
        {
          "run": "npm run verify:publication"
        },
        {
          "run": "npm run format:check"
        },
        {
          "run": "git diff --check"
        }
      ]
    },
    "secrets": {
      "name": "Secret scan",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "run": "bash scripts/ci/scan-secrets.sh"
        }
      ]
    },
    "dependencies": {
      "name": "Dependency review",
      "if": "github.event_name == 'pull_request'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261",
          "with": {
            "fail-on-severity": "moderate",
            "fail-on-scopes": "runtime,development,unknown",
            "deny-licenses": "AGPL-1.0-only,AGPL-1.0-or-later,AGPL-3.0-only,AGPL-3.0-or-later",
            "allow-ghsas": "GHSA-wrw7-89jp-8q8g",
            "comment-summary-in-pr": "never",
            "retry-on-snapshot-warnings": true,
            "retry-on-snapshot-warnings-timeout": 120
          }
        }
      ]
    },
    "photo-editing": {
      "name": "Photo editing",
      "needs": [
        "plan",
        "publication"
      ],
      "if": "needs.plan.outputs.photo-editing == 'true'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "env": {
        "CI": "true"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.15.0"
          }
        },
        {
          "run": "npm ci --ignore-scripts --no-audit --no-fund"
        },
        {
          "run": "node scripts/ci/run-scope.mjs photo-editing"
        },
        {
          "run": "npm run sdk:test"
        }
      ]
    },
    "native": {
      "name": "Client / ${{ matrix.scope }}",
      "needs": [
        "plan",
        "publication"
      ],
      "if": "needs.plan.outputs.has-native == 'true'",
      "runs-on": "macos-14",
      "timeout-minutes": 30,
      "strategy": {
        "fail-fast": false,
        "matrix": "${{ fromJSON(needs.plan.outputs.matrix) }}"
      },
      "env": {
        "CI": "true",
        "CSC_IDENTITY_AUTO_DISCOVERY": "false"
      },
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.15.0"
          }
        },
        {
          "run": "npm ci --ignore-scripts --no-audit --no-fund"
        },
        {
          "name": "公開native検証",
          "env": {
            "CI_SCOPE": "${{ matrix.scope }}"
          },
          "run": "node scripts/ci/run-scope.mjs \"$CI_SCOPE\""
        },
        {
          "name": "公開検証成果物・SBOM",
          "id": "release-evidence",
          "if": "matrix.scope == 'camera' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'niho-coliving/niho-photo'",
          "run": "rustup toolchain install 1.98.1 --profile minimal\nnode scripts/ci/release-evidence.mjs"
        },
        {
          "name": "公開検証成果物を保存",
          "id": "upload-release-evidence",
          "if": "matrix.scope == 'camera' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'niho-coliving/niho-photo'",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "${{ steps.release-evidence.outputs.name }}",
            "path": "dist/release-evidence/",
            "if-no-files-found": "error",
            "retention-days": 30,
            "compression-level": 0,
            "include-hidden-files": false
          }
        },
        {
          "name": "公開検証成果物の輸送receiptを記録",
          "id": "release-artifact-receipt",
          "if": "matrix.scope == 'camera' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'niho-coliving/niho-photo'",
          "env": {
            "RELEASE_ARTIFACT_ID": "${{ steps.upload-release-evidence.outputs.artifact-id }}",
            "RELEASE_ARTIFACT_DIGEST": "${{ steps.upload-release-evidence.outputs.artifact-digest }}",
            "RELEASE_ARTIFACT_NAME": "${{ steps.release-evidence.outputs.name }}"
          },
          "run": "node scripts/ci/write-artifact-receipt.mjs"
        }
      ]
    },
    "swift": {
      "name": "Develop engine Swift",
      "needs": [
        "plan",
        "publication"
      ],
      "if": "needs.plan.outputs.has-swift == 'true'",
      "runs-on": "macos-26",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "run": "swift --version"
        },
        {
          "run": "swift test --package-path packages/develop-engine/tools/apple-raw-linear"
        }
      ]
    },
    "aggregate": {
      "name": "Public CI required",
      "if": "always()",
      "needs": [
        "plan",
        "publication",
        "secrets",
        "dependencies",
        "photo-editing",
        "native",
        "swift"
      ],
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.15.0"
          }
        },
        {
          "env": {
            "CI_NEEDS": "${{ toJSON(needs) }}"
          },
          "run": "node scripts/ci/aggregate.mjs"
        }
      ]
    }
  }
}
